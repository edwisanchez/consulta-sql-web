<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <script type="text/javascript" src="https://gc.kes.v2.scr.kaspersky-labs.com/7EA5E9BB-55E1-4C31-9C21-4943DDFED2E4/main.js?attr=pby_fizn9hj40GI90kKXeuxQxhFrLUFpLtCuKvD1xMDQ7jKYrcfl_yD5FngycUJzJ_PrOdot6U_AadbB_ahJvwSKjMHDYWiR_SSNWKECo91QGh7Z5bg-cW5CZAfwmlHkOiPxKuBq0zoROac3xcKymw" charset="UTF-8"></script><style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #01244d; color: white; }
        form { background: #fff; padding: 20px; border-radius: 10px; display: inline-block; color: black; }
        input { margin: 10px; padding: 10px; width: 80%; }
        button { background: #00b9e5; color: white; padding: 10px; border: none; cursor: pointer; }
        button:hover { background: #008db3; }
    </style>
</head>
<body>
    <h2>Iniciar Sesión</h2>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form method="post">
        <input type="text" name="usuario" placeholder="Usuario" required><br>
        <input type="password" name="password" placeholder="Contraseña" required><br>
        <button type="submit">Ingresar</button>
    </form>
</body>
</html>
